[build-system]
requires = ["setuptools >= 64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freqtrade"
dynamic = ["version"]

authors = [
  {name = "Freqtrade Team"},
  {name = "Freqtrade Team", email = "freqtrade@protonmail.com"},
]

description = "Freqtrade - Crypto Trading Bot"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPLv3"}
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: Unix",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
  # from requirements.txt
  "ccxt==4.5.42",
  "sqlalchemy==2.0.47",
  "python-telegram-bot==22.6",
  "humanize==4.15.0",
  "cachetools==7.0.1",
  "requests==2.32.5",
  "httpx>=0.24.1",
  "urllib3==2.6.3",
  "jsonschema==4.26.0",
  "numpy==2.4.2",
  "pandas==2.3.3",
  "ta-lib==0.6.8",
  "ft-pandas-ta==0.3.16",
  "technical==1.5.4",
  "tabulate==0.9.0",
  "pycoingecko==3.2.0",
  "python-rapidjson==1.23",
  "orjson==3.11.7",
  "jinja2==3.1.6",
  "questionary==2.1.1",
  "prompt-toolkit==3.0.52",
  "joblib==1.5.3",
  "rich==14.3.3",
  "pyarrow==23.0.1 ; platform_machine != 'armv7l'",
  "fastapi==0.135.1",
  "pydantic==2.12.5",
  "pyjwt==2.11.0",
  "websockets==16.0",
  "uvicorn==0.41.0",
  "psutil==7.2.2",
  "schedule==1.2.2",
  "janus==2.0.0",
  "ast-comments==1.3.0",
  "aiofiles==25.1.0",
  "aiohttp==3.13.3",
  "cryptography==46.0.5",
  "sdnotify==0.3.2",
  "python-dateutil==2.9.0.post0",
  "pytz==2025.2",
  "packaging==26.0",
  "freqtrade-client",
  "bottleneck==1.6.0",
  "numexpr==2.14.1",
  "certifi==2026.2.25",
  "plotly==6.5.2",
  "scipy==1.17.1",
  "scikit-learn==1.8.0",
  "filelock==3.25.0",
  "optuna==4.7.0",
  "cmaes==0.12.0",
  "lightgbm==4.6.0",
  "xgboost==3.2.0",
  "tensorboard==2.20.0",
  "datasieve==0.1.9",
  "torch==2.10.0 ; platform_machine != 'x86_64' or sys_platform != 'darwin'",
  "gymnasium==1.2.3",
  "stable-baselines3==2.7.1 ; platform_machine != 'x86_64' or sys_platform != 'darwin'",
  "sb3-contrib>=2.2.1 ; platform_machine != 'x86_64' or sys_platform != 'darwin'",
  "tqdm==4.67.3",
  "markdown==3.10.2",
  "mkdocs==1.6.1",
